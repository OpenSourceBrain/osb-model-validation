name: Test across versions

on:
  schedule:
    - cron: "1 1 15 */1 *"  # Run once a month to test...
  push:
    branches: [ master, development, experimental, test* ]
  pull_request:
    branches: [ master, development, experimental, test* ]

jobs:
  build:

    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        runs-on: [ubuntu-latest, macos-14, macos-latest ]
        exclude:
          - runs-on: macos-14
            python-version: "3.9"
          - runs-on: macos-latest
            python-version: "3.9"

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}


    - name: Install HDF5 for pytables on macos-latest
      run: |
        # if [[  ${{ matrix.python-version }} == "3.11" ]] || [[  ${{ matrix.python-version }} == "3.12" ]]; then 
        if [[  ${{ matrix.runs-on }} == "macos-latest" ]]; then brew install hdf5 ; fi;
        #fi;


    - name: Install OMV
      run: |
        pip install .
        pip list


    - name: Run pytest 
      run: |
        pip install pytest
        cd omv/test
        pytest -vs

    - name: Run simple OMV tests
      run: |
        omv all -V --engine=jNeuroML_NEURON
        omv test -V utilities/tests/.test.exIzh.jnmlnetpyne.omt

    - name: Run broken test with flag --exit-zero
      run: |
        # This is known to fail, but should not cause the CI to fail due to the --exit-zero flag
        omv test -V utilities/tests/brokentest/.test.ex9.jnml.omt.broken --exit-zero

    - name: OMV final version info
      run: |
        omv list -V # list installed engines
        env
        pip list
